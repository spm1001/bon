[project]
name = "bon"
dynamic = ["version"]
description = "Lightweight work tracker for Claude-human collaboration"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dolt = ["pymysql>=1.2.0"]

[project.scripts]
bon = "bon.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = ".claude-plugin/plugin.json"
pattern = "\"version\":\\s*\"(?P<version>[^\"]+)\""

[tool.hatch.build.targets.wheel]
packages = ["src/bon"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.1",
]

[tool.ruff]
src = ["src"]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = [
    "E501",   # Line length handled separately
    "E402",   # Module import not at top (circular import workarounds)
    "SIM108", # Ternary suggestions (readability preference)
    "SIM117", # Nested with statements (clearer for pytest contexts)
]
